<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>contact</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Karla:wght@400;500&family=Libre+Baskerville:ital,wght@0,400;1,400&family=Noto+Sans+SC:wght@400;500&family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/site.css">
  </head>
  <body data-page="contact">
    <div class="wrap">
      <header class="site-header">
        <a class="brand" href="index.html">
          <span class="brand-name" data-brand-name></span>
          <span class="brand-tag" data-brand-tag></span>
        </a>
        <nav class="nav" aria-label="主导航">
          <a href="works.html">illustration</a>
          <a href="books.html">books</a>
          <a href="about.html">about</a>
          <a href="contact.html">contact</a>
        </nav>
      </header>

      <div class="contact-block">
        <div class="prose">
          <p>约稿、出版、展览、工作坊，都可以从这里开始。</p>
          <p>Say hello -> <a data-email></a></p>
        </div>
        <form data-contact-form>
          <label class="field">
            <span>name</span>
            <input name="name" required autocomplete="name">
          </label>
          <label class="field">
            <span>email</span>
            <input name="reply" type="email" required autocomplete="email">
          </label>
          <label class="field">
            <span>message</span>
            <textarea name="message" rows="6" required></textarea>
          </label>
          <button type="submit">send</button>
        </form>
      </div>

      <footer class="site-footer">
        <span>contact</span>
      </footer>
    </div>
    <script src="js/config.js"></script>
    <script src="js/site.js"></script>
  </body>
</html>
